[package]
name = "pubnetdiag"
version = "0.1.0"
edition = "2024"
description = "Wi-Fi diagnostic tool — scans visible APs and flags WPA2+WPA3 transition-mode issues."

[[bin]]
name = "pubnetdiag"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
pubnet-platform = { path = "../pubnet-platform" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

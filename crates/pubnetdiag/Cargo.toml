[package]
name = "pubnetdiag"
version.workspace = true
edition = "2024"
description = "Wi-Fi diagnostic tool — scans visible APs and flags WPA2+WPA3 transition-mode issues."

[lib]
name = "pubnetdiag"
path = "src/lib.rs"

[[bin]]
name = "pubnetdiag"
path = "src/main.rs"

[[bin]]
name = "gen_exit_codes"
path = "src/bin/gen_exit_codes.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
pubnet-platform = { path = "../pubnet-platform" }
rpassword = "7"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

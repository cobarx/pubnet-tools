[package]
name = "pubnet-tools"
version.workspace = true
edition = "2024"
description = "Audit the public WiFi or network you just joined - security, speed, reliability, and passive topology."

[[bin]]
name = "pubnetchk"
path = "src/main.rs"

[features]
# TLS backend. Desktop builds (Linux/macOS/Windows) use the system provider via
# native-tls — see docs/decisions/2026-08-28-android-tls-rustls.md and the
# "no system-OpenSSL dependency" note in CLAUDE.md. The Android cdylib
# (crates/pubnetchk-android) builds with `--no-default-features --features
# tls-rustls`, because Android exposes no system TLS to an app.
default = ["tls-native"]
tls-native = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
# reqwest 0.13's `rustls` feature = the aws-lc-rs crypto provider +
# rustls-platform-verifier. That verifier `abort()`s the process on Android if
# no JVM Context was ever registered (the cdylib is loaded through JNA, not
# System.loadLibrary, so there is none) — so on this path `crate::tls` builds
# reqwest with a webpki-roots ClientConfig via `use_preconfigured_tls`, never
# invoking the platform verifier. Same roots tokio-tungstenite already uses for
# the NDT7 WebSocket. See docs/decisions/2026-08-30-android-tls-rustls.md.
tls-rustls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-webpki-roots",
    "dep:rustls",
    "dep:webpki-roots",
]

[dependencies]
pubnet-platform = { path = "../pubnet-platform" }
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
futures-util = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.2"
# `cli.rs` parses the asciinema version string with a regex. `regex` is also a
# dependency of pubnet-platform, but Cargo does not hoist it into this crate.
regex = "1.13.1"
# No "http2" feature: every request we make (DoH GETs, captive-portal canaries,
# the M-Lab locate lookup) is a simple HTTP/1.1 GET, and dropping h2 removes the
# whole h2 subtree (~300KB off the binary). Cloudflare/Google DoH both serve over
# HTTP/1.1 fine. The TLS backend comes from the `tls-*` features above, not here.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
# Only pulled by `tls-rustls` (Android) — see `crate::tls`. Versions track what
# reqwest's `rustls` feature already resolves, so this adds no new tree on that
# path and nothing at all on the desktop `tls-native` default.
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process", "fs"] }
# default features (connect, handshake) stay on; the TLS backend comes from the
# `tls-*` features above.
tokio-tungstenite = { version = "0.30.0" }

[dev-dependencies]
tempfile = "3.27.0"

[workspace]
members = ["crates/pubnetchk", "crates/pubnet-platform", "crates/pubnetdiag", "crates/pubnetchk-android"]
resolver = "2"

# One version for the whole pubnet-tools suite — every crate does
# `version.workspace = true`, the Android app reads this into `versionName`
# (android/app/build.gradle.kts), and `report_schema_version()` /
# `audit::VERSION` (= CARGO_PKG_VERSION) report it. Bump here only.
# See docs/decisions/2026-09-04-single-suite-version.md.
[workspace.package]
version = "0.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"   # optimize for size, not speed - see docs/decisions/2026-08-25-rust-rewrite-technology-stack.md; this whole exercise started as a binary-size question, and every check is dominated by network I/O anyway, not CPU-bound code
panic = "abort"   # drop stack-unwinding tables (.eh_frame/.gcc_except_table/.eh_frame_hdr, ~480KB / ~14% of the binary) - a CLI that panics just exits, so unwinding buys nothing

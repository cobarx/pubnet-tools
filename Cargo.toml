[package]
name = "pubnet-tools"
version = "0.1.0"
edition = "2024"
description = "Audit the public network you just joined - security, speed, reliability, and passive topology."

[[bin]]
name = "pubnetchk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
futures-util = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.2"
regex = "1.13.1"
# No "http2" feature: every request we make (DoH GETs, captive-portal canaries,
# the M-Lab locate lookup) is a simple HTTP/1.1 GET, and dropping h2 removes the
# whole h2 subtree (~300KB off the binary). Cloudflare/Google DoH both serve over
# HTTP/1.1 fine.
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

# Windows probes call the Win32 API directly (IP Helper + WLAN + ICMP) rather
# than shelling out to PowerShell/netsh/ping.exe — see
# docs/decisions/2026-08-28-windows-probes-via-win32-api.md. Already a transitive
# dep via tokio; this only enables the network feature modules. Windows-only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"   # optimize for size, not speed - see docs/decisions/2026-08-25-rust-rewrite-technology-stack.md; this whole exercise started as a binary-size question, and every check is dominated by network I/O anyway, not CPU-bound code
panic = "abort"   # drop stack-unwinding tables (.eh_frame/.gcc_except_table/.eh_frame_hdr, ~480KB / ~14% of the binary) - a CLI that panics just exits, so unwinding buys nothing
